services:
  api:
    build: .
    container_name: public-square-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/public_square.db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=43200
      - CORS_ORIGINS=${CORS_ORIGINS}
      - API_TITLE=Public Square API
      - API_VERSION=1.0.0
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
